<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kesmic Practice Manager">
  <title>Kesmic Practice Manager</title>
  <!--
    A reviewed working paper: a document with ruled lines and an approval tick.
    That is the single idea the whole system turns on — work is prepared, then
    signed off by someone else — so it is what the mark shows.

    Drawn on a 64-unit grid with heavy strokes so it survives being shown at
    16 pixels in a browser tab. Colours are literal rather than themed: a favicon
    is composited by the browser, outside the page's stylesheet.
  -->
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f639f" />
      <stop offset="1" stop-color="#1c3861" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#k-bg)" />

  <!-- The working paper, with a folded corner. -->
  <path
    d="M17 12h15.5L42 21.5V43a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z"
    fill="#ffffff"
    fill-opacity="0.96"
  />
  <path d="M32 12.5V20a1.5 1.5 0 0 0 1.5 1.5h7.5z" fill="#2f639f" fill-opacity="0.45" />

  <!-- Ruled lines: the figures on the page. -->
  <g stroke="#1c3861" stroke-opacity="0.5" stroke-width="2.6" stroke-linecap="round">
    <path d="M23 27h12" />
    <path d="M23 33h12" />
    <path d="M23 39h6" />
  </g>

  <!-- The sign-off, breaking the frame so it reads as approval, not decoration. -->
  <path
    d="M31 40 39 48 53 27"
    fill="none"
    stroke="#0f2440"
    stroke-opacity="0.35"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M31 40 39 48 53 27"
    fill="none"
    stroke="#34d399"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
