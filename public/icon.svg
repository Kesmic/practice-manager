<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kesmic Practice Manager">
  <title>Kesmic Practice Manager</title>
  <!--
    The firm's initial. A K whose two arms meet at the stem like two entries
    meeting on a ledger, with the upper arm in the firm's teal so the letter
    reads as a mark rather than a typed capital.

    Drawn on a 64-unit grid with 8-unit strokes so it survives being shown at
    16 pixels in a browser tab. Colours are literal rather than themed: a favicon
    is composited by the browser, outside the page's stylesheet.
  -->
  <rect width="64" height="64" rx="14" fill="#0F2440" />
  <path d="M18 14v36" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M45 14 22 32" stroke="#0F766E" stroke-width="8" stroke-linecap="round" />
  <path d="M22 32 45 50" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>
