<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kesmic Practice Manager</title>
    <meta name="description" content="Client task and deliverable workflow management for Kesmic Consulting." />

    <!--
      An SVG favicon, which every current browser prefers: one file, sharp at any
      size, and no separate 16/32/48 pixel variants to keep in step. The mark is the
      firm's initial - see public/icon.svg.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      Installable as an app. The manifest names it and gives it icons; the service
      worker (public/sw.js) is what lets a phone or a laptop keep it on the home screen
      and what receives push notifications. Apple reads its own tags rather than the
      manifest, so both are here.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kesmic" />
    <meta name="theme-color" content="#0F2440" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
