name: Deploy

# Every push to main goes live automatically. Nothing is deployed by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same Worker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here on purpose. Naming an environment can introduce an
    # approval gate that silently parks the deploy in a "waiting" state, which is
    # confusing when you are expecting a push to main to simply go live.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build the app
        run: npm run build

      # Copying a token out of a web page can silently carry invisible
      # characters with it — a zero-width space (U+200B) is the usual culprit,
      # and it makes Cloudflare reject the credential with an error that reads
      # as though the token itself were wrong. Both values are made only of
      # letters, digits, underscores and hyphens, so anything outside that set
      # is copy-paste debris and safe to drop.
      - name: Clean the Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          token=$(printf '%s' "$RAW_TOKEN"   | tr -cd 'A-Za-z0-9_-')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -cd 'A-Za-z0-9_-')

          if [ -z "$token" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$account" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Report that debris was removed without ever revealing the value.
          if [ "${#RAW_TOKEN}" -ne "${#token}" ]; then
            echo "Removed $(( ${#RAW_TOKEN} - ${#token} )) stray character(s) from CLOUDFLARE_API_TOKEN."
          fi
          if [ "${#RAW_ACCOUNT}" -ne "${#account}" ]; then
            echo "Removed $(( ${#RAW_ACCOUNT} - ${#account} )) stray character(s) from CLOUDFLARE_ACCOUNT_ID."
          fi

          # Mask the cleaned values too: GitHub only masks the exact stored
          # secret, so a variant of it would otherwise print in plain text.
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      # Migrations run before the new code goes out, so the schema is always at
      # least as new as the Worker reading it. Migrations must therefore be
      # additive — never drop or rename a column a released Worker still uses.
      # Credentials come from the cleaning step above via the job environment.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply kesmic-practice --remote
        env:
          CI: "true"

      # Creating the project is done here rather than by hand so there is one
      # less thing to get exactly right in a dashboard. It only ever happens once.
      - name: Make sure the Pages project exists
        run: |
          set -euo pipefail
          if npx wrangler pages project list | grep -q 'kesmic-practice-manager'; then
            echo "Pages project already exists."
          else
            echo "First deploy — creating the Pages project."
            npx wrangler pages project create kesmic-practice-manager \
              --production-branch=main
          fi

      # --branch is explicit because Pages decides production versus preview from
      # the branch name, and a deploy that quietly lands as a preview would leave
      # the real address serving the previous version.
      - name: Deploy the app and the Worker
        run: npx wrangler pages deploy --branch=main

      - name: Summarise
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::7}\` is live." >> "$GITHUB_STEP_SUMMARY"
