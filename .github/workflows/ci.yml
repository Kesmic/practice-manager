name: CI

# Guards the branch: a change that does not typecheck or build never reaches
# main, and so can never reach production.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The workflow engine, the sign-in limit and the deadline arithmetic. These are
      # the parts where being wrong is a control failure rather than a broken screen,
      # so they are checked before anything is built.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # Catches a migration that fails to apply before it reaches production.
      - name: Verify migrations apply to a clean database
        run: npx wrangler d1 migrations apply kesmic-practice --local
        env:
          CI: "true"
